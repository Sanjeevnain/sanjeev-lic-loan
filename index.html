<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC DSA Loan Services - Sanjeev Nain | Home & Business Loans</title>

    <meta name="google-site-verification" content="ip-GMEmoZw4OqrSPrigpNcio9zGPiLpGulL5L0x9Qt8" />
    
    <meta name="description" content="Apply for Home Loan, Business Loan, and Loan Transfer with LIC DSA Agent Sanjeev Nain. Get best interest rates and quick approval. Contact 9468255026.">
    <meta name="keywords" content="LIC DSA, Sanjeev Nain, Home Loan, Business Loan, Loan Transfer, Apply Loan Online, Lowest EMI">
</head>
<body style="box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; color: #333; padding-bottom: 80px; line-height: 1.6;">

    <!-- Header Section -->
    <header style="background-color: #1e40af; color: white; padding: 20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100;">
        <div style="width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;">
            <div style="margin-bottom: 10px;">
                <h1 style="font-size: 26px; font-weight: bold; color: #facc15; margin: 0;">LIC DSA LOAN SERVICES</h1>
                <p style="font-size: 14px; color: #93c5fd; font-weight: 500; margin: 2px 0 0 0;">Your Trust, Our Responsibility</p>
            </div>
            <div style="margin-top: 5px;">
                <p style="font-size: 11px; color: #93c5fd; text-transform: uppercase; margin: 0;">Financial Advisor & Agent</p>
                <h2 style="font-size: 22px; color: white; font-weight: bold; margin: 0;">Sanjeev Nain</h2>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section style="background: linear-gradient(135deg, #1d4ed8, #4338ca); color: white; padding: 40px 20px; text-align: center;">
        <div style="width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 20px;">
            <h2 style="font-size: 30px; font-weight: 800; margin-bottom: 15px;">Looking for the Lowest Interest Rate Loans?</h2>
            <p style="font-size: 16px; color: #e0e7ff; margin-bottom: 25px;">Select your loan type below and apply instantly via WhatsApp.</p>
        </div>
    </section>

    <!-- Dynamic Smart Form Section -->
    <section id="query-form" style="width: 100%; max-width: 1000px; margin: 30px auto; padding: 0 20px;">
        <div style="background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 550px; margin: 0 auto; border: 1px solid #e5e7eb;">
            
            <h3 style="text-align: center; color: #1e3a8a; font-size: 24px; font-weight: bold; margin-bottom: 15px; margin-top: 0;">Select Loan Type to Apply</h3>
            
            <!-- 3 Grand Tabs/Buttons for selection -->
            <div style="display: flex; gap: 10px; margin-bottom: 25px; justify-content: space-between;">
                <button onclick="switchLoanForm('Home')" id="btnHome" style="flex: 1; padding: 12px 5px; font-weight: bold; border-radius: 8px; border: 2px solid #2563eb; background-color: #2563eb; color: white; cursor: pointer; font-size: 13px;">🏠 Home Loan</button>
                <button onclick="switchLoanForm('Business')" id="btnBusiness" style="flex: 1; padding: 12px 5px; font-weight: bold; border-radius: 8px; border: 2px solid #16a34a; background-color: white; color: #16a34a; cursor: pointer; font-size: 13px;">🏢 Business</button>
                <button onclick="switchLoanForm('Transfer')" id="btnTransfer" style="flex: 1; padding: 12px 5px; font-weight: bold; border-radius: 8px; border: 2px solid #7c3aed; background-color: white; color: #7c3aed; cursor: pointer; font-size: 13px;">🔄 Transfer</button>
            </div>

            <form id="loanForm" onsubmit="sendToWhatsApp(event)">
                
                <!-- Active Loan Info Indicator -->
                <div style="margin-bottom: 20px; padding: 8px; background-color: #e0e7ff; border-radius: 6px; text-align: center; font-weight: bold; color: #1e40af;" id="loanIndicator">
                    Applying for: Home Loan
                </div>

                <!-- Hidden Input to track form state -->
                <input type="hidden" id="selectedLoanType" value="Home Loan">

                <!-- Common Fields -->
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #374151;">Customer Full Name *</label>
                    <input type="text" id="custName" required placeholder="Enter your full name" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #374151;">City / Location *</label>
                    <input type="text" id="custLocation" required placeholder="e.g. Jaipur" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #374151;">Age *</label>
                    <input type="number" id="custAge" required min="18" max="70" placeholder="e.g. 30" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #374151;">Monthly Income *</label>
                    <input type="text" id="monthlyIncome" required placeholder="e.g. 45,000" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #374151;">Amount Required *</label>
                    <input type="text" id="loanAmount" required placeholder="e.g. 15 Lakh" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                </div>

                <!-- 🏠 HOME LOAN SECTION -->
                <div id="homeSection" style="display: block;">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #166534;">Property Location *</label>
                        <input type="text" id="propLocation" placeholder="Where is the property?" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #166534;">Property Value *</label>
                        <input type="text" id="propValue" placeholder="e.g. 25 Lakh" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    </div>
                </div>

                <!-- 🏢 BUSINESS LOAN SECTION -->
                <div id="businessSection" style="display: none;">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #9a3412;">Business Type *</label>
                        <input type="text" id="businessType" placeholder="e.g. Retail Shop, Factory" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #9a3412;">Annual Turnover *</label>
                        <input type="text" id="businessTurnover" placeholder="e.g. 20 Lakh" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    </div>
                </div>

                <!-- 🔄 LOAN TRANSFER SECTION -->
                <div id="transferSection" style="display: none;">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #6b21a8;">Current Bank Name *</label>
                        <input type="text" id="currentBank" placeholder="e.g. SBI, HDFC" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #6b21a8;">Current ROI (Interest Rate %) *</label>
                        <input type="text" id="currentROI" placeholder="e.g. 9.5%" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    </div>
                </div>
                
                <button type="submit" style="width: 100%; background-color: #16a34a; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px;">
                    Send Inquiry on WhatsApp
                </button>
